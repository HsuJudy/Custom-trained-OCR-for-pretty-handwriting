<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Handwriting OCR Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">
    <!-- Navigation -->
    <nav class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <h1 class="text-xl font-semibold text-gray-900">Handwriting OCR Dashboard</h1>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="/" class="text-blue-600 hover:text-blue-800">Data Collector</a>
                    <button id="create-project-btn" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">
                        New Project
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Stats Overview -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="bg-white rounded-lg shadow p-6">
                <div class="flex items-center">
                    <div class="p-2 bg-blue-100 rounded-lg">
                        <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
                        </svg>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm font-medium text-gray-600">Total Projects</p>
                        <p id="total-projects" class="text-2xl font-semibold text-gray-900">0</p>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-lg shadow p-6">
                <div class="flex items-center">
                    <div class="p-2 bg-green-100 rounded-lg">
                        <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                        </svg>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm font-medium text-gray-600">Total Images</p>
                        <p id="total-images" class="text-2xl font-semibold text-gray-900">0</p>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-lg shadow p-6">
                <div class="flex items-center">
                    <div class="p-2 bg-yellow-100 rounded-lg">
                        <svg class="w-6 h-6 text-yellow-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"></path>
                        </svg>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm font-medium text-gray-600">Total Labels</p>
                        <p id="total-labels" class="text-2xl font-semibold text-gray-900">0</p>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-lg shadow p-6">
                <div class="flex items-center">
                    <div class="p-2 bg-purple-100 rounded-lg">
                        <svg class="w-6 h-6 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                        </svg>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm font-medium text-gray-600">Journal Entries</p>
                        <p id="total-entries" class="text-2xl font-semibold text-gray-900">0</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Projects List -->
        <div class="bg-white rounded-lg shadow">
            <div class="px-6 py-4 border-b border-gray-200">
                <h2 class="text-lg font-medium text-gray-900">Your Projects</h2>
            </div>
            <div class="p-6">
                <div id="projects-list" class="space-y-4">
                    <!-- Projects will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Create Project Modal -->
    <div id="create-project-modal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden z-50">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-white rounded-lg shadow-xl max-w-md w-full">
                <div class="px-6 py-4 border-b border-gray-200">
                    <h3 class="text-lg font-medium text-gray-900">Create New Project</h3>
                </div>
                <form id="create-project-form" class="p-6">
                    <div class="mb-4">
                        <label for="project-name" class="block text-sm font-medium text-gray-700 mb-2">Project Name</label>
                        <input type="text" id="project-name" name="name" required
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div class="mb-6">
                        <label for="project-description" class="block text-sm font-medium text-gray-700 mb-2">Description (Optional)</label>
                        <textarea id="project-description" name="description" rows="3"
                                  class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                    </div>
                    <div class="flex justify-end space-x-3">
                        <button type="button" id="cancel-project-btn"
                                class="px-4 py-2 text-gray-700 bg-gray-200 rounded-md hover:bg-gray-300">
                            Cancel
                        </button>
                        <button type="submit"
                                class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">
                            Create Project
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Project Analytics Modal -->
    <div id="analytics-modal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden z-50">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-white rounded-lg shadow-xl max-w-4xl w-full max-h-screen overflow-y-auto">
                <div class="px-6 py-4 border-b border-gray-200">
                    <div class="flex justify-between items-center">
                        <h3 class="text-lg font-medium text-gray-900">Project Analytics</h3>
                        <button id="close-analytics-btn" class="text-gray-400 hover:text-gray-600">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                            </svg>
                        </button>
                    </div>
                </div>
                <div id="analytics-content" class="p-6">
                    <!-- Analytics content will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // Global state
        let projects = [];
        let currentProjectId = null;

        // Initialize dashboard
        document.addEventListener('DOMContentLoaded', () => {
            loadProjects();
            setupEventListeners();
        });

        function setupEventListeners() {
            // Create project modal
            document.getElementById('create-project-btn').addEventListener('click', () => {
                document.getElementById('create-project-modal').classList.remove('hidden');
            });

            document.getElementById('cancel-project-btn').addEventListener('click', () => {
                document.getElementById('create-project-modal').classList.add('hidden');
            });

            document.getElementById('close-analytics-btn').addEventListener('click', () => {
                document.getElementById('analytics-modal').classList.add('hidden');
            });

            // Create project form
            document.getElementById('create-project-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                await createProject();
            });
        }

        async function loadProjects() {
            try {
                const response = await fetch('/api/projects?user_id=default_user');
                const data = await response.json();
                
                if (data.success) {
                    projects = data.projects;
                    renderProjects();
                    updateStats();
                }
            } catch (error) {
                console.error('Error loading projects:', error);
            }
        }

        function renderProjects() {
            const projectsList = document.getElementById('projects-list');
            
            if (projects.length === 0) {
                projectsList.innerHTML = `
                    <div class="text-center py-8">
                        <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
                        </svg>
                        <h3 class="mt-2 text-sm font-medium text-gray-900">No projects</h3>
                        <p class="mt-1 text-sm text-gray-500">Get started by creating a new project.</p>
                    </div>
                `;
                return;
            }

            projectsList.innerHTML = projects.map(project => `
                <div class="border border-gray-200 rounded-lg p-6 hover:shadow-md transition-shadow">
                    <div class="flex justify-between items-start">
                        <div class="flex-1">
                            <h3 class="text-lg font-medium text-gray-900">${project.name}</h3>
                            <p class="text-sm text-gray-600 mt-1">${project.description || 'No description'}</p>
                            <div class="flex items-center mt-4 space-x-6 text-sm text-gray-500">
                                <span>${project.image_count} images</span>
                                <span>${project.entry_count} entries</span>
                                <span class="px-2 py-1 bg-green-100 text-green-800 rounded-full text-xs">${project.status}</span>
                            </div>
                        </div>
                        <div class="flex space-x-2">
                            <button onclick="viewAnalytics('${project.id}')" 
                                    class="px-3 py-1 text-sm bg-blue-100 text-blue-700 rounded hover:bg-blue-200">
                                Analytics
                            </button>
                            <button onclick="exportProject('${project.id}')" 
                                    class="px-3 py-1 text-sm bg-green-100 text-green-700 rounded hover:bg-green-200">
                                Export
                            </button>
                            <a href="/?project_id=${project.id}" 
                               class="px-3 py-1 text-sm bg-purple-100 text-purple-700 rounded hover:bg-purple-200">
                                Label Data
                            </a>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function updateStats() {
            const totalProjects = projects.length;
            const totalImages = projects.reduce((sum, p) => sum + p.image_count, 0);
            const totalEntries = projects.reduce((sum, p) => sum + p.entry_count, 0);
            const totalLabels = totalImages * 10; // Estimate based on images

            document.getElementById('total-projects').textContent = totalProjects;
            document.getElementById('total-images').textContent = totalImages;
            document.getElementById('total-labels').textContent = totalLabels;
            document.getElementById('total-entries').textContent = totalEntries;
        }

        async function createProject() {
            const name = document.getElementById('project-name').value;
            const description = document.getElementById('project-description').value;

            try {
                const response = await fetch('/api/projects', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        name: name,
                        description: description,
                        user_id: 'default_user'
                    })
                });

                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('create-project-modal').classList.add('hidden');
                    document.getElementById('create-project-form').reset();
                    await loadProjects();
                } else {
                    alert('Error creating project: ' + data.error);
                }
            } catch (error) {
                console.error('Error creating project:', error);
                alert('Error creating project');
            }
        }

        async function viewAnalytics(projectId) {
            try {
                const response = await fetch(`/api/projects/${projectId}/analytics`);
                const data = await response.json();
                
                if (data.success) {
                    renderAnalytics(data.analytics);
                    document.getElementById('analytics-modal').classList.remove('hidden');
                } else {
                    alert('Error loading analytics: ' + data.error);
                }
            } catch (error) {
                console.error('Error loading analytics:', error);
                alert('Error loading analytics');
            }
        }

        function renderAnalytics(analytics) {
            const content = document.getElementById('analytics-content');
            
            content.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="bg-gray-50 rounded-lg p-6">
                        <h4 class="text-lg font-medium text-gray-900 mb-4">Project Overview</h4>
                        <div class="space-y-3">
                            <div class="flex justify-between">
                                <span class="text-gray-600">Project Name:</span>
                                <span class="font-medium">${analytics.project_name}</span>
                            </div>
                            <div class="flex justify-between">
                                <span class="text-gray-600">Total Images:</span>
                                <span class="font-medium">${analytics.total_images}</span>
                            </div>
                            <div class="flex justify-between">
                                <span class="text-gray-600">Total Labels:</span>
                                <span class="font-medium">${analytics.total_labels}</span>
                            </div>
                            <div class="flex justify-between">
                                <span class="text-gray-600">Journal Entries:</span>
                                <span class="font-medium">${analytics.total_entries}</span>
                            </div>
                            <div class="flex justify-between">
                                <span class="text-gray-600">Color Stickers:</span>
                                <span class="font-medium">${analytics.total_stickers}</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="bg-gray-50 rounded-lg p-6">
                        <h4 class="text-lg font-medium text-gray-900 mb-4">Themes & Colors</h4>
                        <div class="space-y-3">
                            <div class="flex justify-between">
                                <span class="text-gray-600">Unique Themes:</span>
                                <span class="font-medium">${analytics.theme_count}</span>
                            </div>
                            <div class="flex justify-between">
                                <span class="text-gray-600">Color Codes:</span>
                                <span class="font-medium">${analytics.color_count}</span>
                            </div>
                        </div>
                        
                        ${analytics.unique_themes.length > 0 ? `
                            <div class="mt-4">
                                <h5 class="text-sm font-medium text-gray-700 mb-2">Top Themes:</h5>
                                <div class="flex flex-wrap gap-2">
                                    ${analytics.unique_themes.slice(0, 5).map(theme => 
                                        `<span class="px-2 py-1 bg-blue-100 text-blue-800 rounded text-xs">${theme}</span>`
                                    ).join('')}
                                </div>
                            </div>
                        ` : ''}
                        
                        ${analytics.unique_colors.length > 0 ? `
                            <div class="mt-4">
                                <h5 class="text-sm font-medium text-gray-700 mb-2">Color Codes:</h5>
                                <div class="flex flex-wrap gap-2">
                                    ${analytics.unique_colors.map(color => 
                                        `<span class="px-2 py-1 rounded text-xs text-white" style="background-color: ${color}">${color}</span>`
                                    ).join('')}
                                </div>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        async function exportProject(projectId) {
            try {
                const response = await fetch(`/api/projects/${projectId}/export`);
                
                if (response.ok) {
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `project_${projectId}_export.zip`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(url);
                } else {
                    const data = await response.json();
                    alert('Error exporting project: ' + data.error);
                }
            } catch (error) {
                console.error('Error exporting project:', error);
                alert('Error exporting project');
            }
        }
    </script>
</body>
</html>
